[package]
name = "foreigners_studio"
version = "1.0.18"
description = "Foreigners Studio Enterprise Desktop Application"
authors = ["Foreigners Studio Team"]
edition = "2021"

[lib]
name = "foreigners_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
hmac = "0.13.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
overflow-checks = false
