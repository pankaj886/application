name: Build Foreigners Studio (Windows & macOS)

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Windows Tauri Bundle
        run: |
          npx tauri build --bundles nsis,msi
          node copy-release.js

      - name: Setup Windows Code Signing Certificate
        shell: powershell
        continue-on-error: true
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\generate-cert.ps1

      - name: Sign Windows Binaries with SignTool
        shell: powershell
        continue-on-error: true
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\sign-release.ps1

      - name: Verify Authenticode Signatures
        shell: powershell
        continue-on-error: true
        run: |
          $targets = Get-ChildItem -Path dist-release -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
          foreach ($file in $targets) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status) ($($sig.StatusMessage))"
          }

      - name: Package Windows Portable ZIP
        shell: powershell
        run: |
          $stagingDir = "$env:TEMP\fs_win_bundle_$(New-Guid)"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # Copy signed exe
          $exe = "dist-release\foreigners_studio.exe"
          if (Test-Path $exe) { Copy-Item $exe -Destination "$stagingDir\foreigners_studio.exe" }

          # Copy installers
          Get-ChildItem "dist-release" -Filter "*.exe" | Where-Object { $_.Name -ne "foreigners_studio.exe" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "$stagingDir\$($_.Name)"
          }

          # Copy support files
          if (Test-Path "Install-ForeignersStudio.bat") {
            Copy-Item "Install-ForeignersStudio.bat" -Destination "$stagingDir\Install-ForeignersStudio.bat"
          }
          if (Test-Path "install-windows.ps1") {
            Copy-Item "install-windows.ps1" -Destination "$stagingDir\install-windows.ps1"
          }

          # Copy certificate
          if (Test-Path "certs\ForeignersStudio.cer") {
            New-Item -ItemType Directory -Force -Path "$stagingDir\certs" | Out-Null
            Copy-Item "certs\ForeignersStudio.cer" -Destination "$stagingDir\certs\ForeignersStudio.cer"
            Copy-Item "certs\ForeignersStudio.cer" -Destination "$stagingDir\ForeignersStudio.cer"
          }

          $zipPath = "dist-release\Foreigners_Studio_Windows_x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stagingDir, $zipPath)
          Write-Host "Created ZIP: $zipPath"

          Remove-Item -Recurse -Force $stagingDir -ErrorAction SilentlyContinue

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: foreigners-studio-windows-bundle
          path: |
            dist-release/*.exe
            dist-release/*.msi
            dist-release/*.zip
            dist-release/*.dll
            certs/ForeignersStudio.cer
            Install-ForeignersStudio.bat
            install-windows.ps1

  build-macos:
    name: Build macOS App (.dmg & .app)
    runs-on: macos-latest
    env:
      COPYFILE_DISABLE: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install NPM Dependencies
        run: npm ci

      - name: Import Apple Developer ID Certificate (if configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT || secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || secrets.DEVELOPER_ID_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple Developer Certificate provided in secrets. Using ad-hoc signature."
            exit 0
          fi
          echo "Setting up temporary keychain for Apple Developer ID certificate..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "temp-keychain-pass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "temp-keychain-pass" $KEYCHAIN_PATH

          CERT_PATH=$RUNNER_TEMP/developer_id.p12
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > $CERT_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temp-keychain-pass" $KEYCHAIN_PATH

          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            IDENTITY="$APPLE_SIGNING_IDENTITY"
          else
            IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -n 1 | sed 's/.*"\(.*\)".*/\1/' || true)
          fi

          if [ -n "$IDENTITY" ]; then
            echo "Found Apple Developer ID Identity: $IDENTITY"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          else
            echo "No Developer ID Application identity found in keychain, using ad-hoc"
          fi

      - name: Build macOS Tauri Universal Bundle
        env:
          COPYFILE_DISABLE: "1"
          APPLE_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT || secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY || secrets.DEVELOPER_ID_SIGNING_IDENTITY }}
        run: |
          npx tauri build --target universal-apple-darwin --bundles dmg,app
          node copy-release.js

      - name: Sanitize & Sign macOS Bundle
        env:
          COPYFILE_DISABLE: "1"
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY || secrets.DEVELOPER_ID_SIGNING_IDENTITY }}
        run: bash clean-dmg.sh

      - name: Notarize macOS DMG with Apple (if configured)
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID || secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD || secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.NOTARIZATION_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Apple Notarization credentials not configured in secrets. Skipping notarization."
            exit 0
          fi
          echo "==> Apple Notarization credentials detected. Submitting DMGs to Apple..."
          find dist-release -name "*.dmg" -type f | while read -r DMG_FILE; do
            echo "==> Submitting $DMG_FILE to Apple Notary Service..."
            SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_FILE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait 2>&1)
            echo "$SUBMIT_OUTPUT"
            SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -E '^\s*id:' | head -1 | awk '{print $2}')
            if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
              echo "==> Stapling notarization ticket to $DMG_FILE..."
              xcrun stapler staple "$DMG_FILE"
              xcrun stapler validate "$DMG_FILE"
              echo "✓ Successfully notarized and stapled $DMG_FILE with Apple!"
            else
              echo "❌ Notarization failed for $DMG_FILE!"
              if [ -n "$SUBMISSION_ID" ]; then
                echo "Fetching detailed notarization log from Apple for ID $SUBMISSION_ID..."
                xcrun notarytool log "$SUBMISSION_ID" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              fi
              exit 1
            fi
          done

      - name: Verify macOS Universal DMG & Application
        run: |
          echo "=========================================================="
          echo "  Verifying macOS Universal DMG & Code Signature          "
          echo "=========================================================="

          DMG_FILE=$(find dist-release -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "❌ Error: No DMG found in dist-release!"
            ls -la dist-release || true
            exit 1
          fi
          echo "Found DMG installer: $DMG_FILE"

          # Verify DMG container is signed
          echo "==> Verifying DMG container codesign..."
          codesign --verify --verbose=2 "$DMG_FILE" 2>&1 || echo "Note: DMG container signature check"

          # Check DMG quarantine attributes (should be empty)
          echo "==> Checking DMG quarantine attributes..."
          QATTR=$(xattr -l "$DMG_FILE" 2>/dev/null || true)
          if echo "$QATTR" | grep -q "quarantine"; then
            echo "⚠ WARNING: quarantine attribute still present on DMG"
            xattr -d com.apple.quarantine "$DMG_FILE" 2>/dev/null || true
          else
            echo "✓ DMG has no quarantine attribute"
          fi

          echo "==> Mounting DMG for verification..."
          MOUNT_DIR="/tmp/verify_mount_$$"
          mkdir -p "$MOUNT_DIR"
          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -noautoopen -quiet

          echo "==> Locating .app bundle inside mounted DMG..."
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Error: No .app bundle found inside mounted DMG!"
            ls -la "$MOUNT_DIR"
            hdiutil detach "$MOUNT_DIR" -force -quiet || true
            exit 1
          fi
          echo "Found App bundle: $APP_PATH"

          echo "==> Checking for /Applications drag-and-drop link in DMG..."
          if [ -L "$MOUNT_DIR/Applications" ] || [ -d "$MOUNT_DIR/Applications" ]; then
            echo "✓ Drag-to-Applications shortcut verified inside DMG!"
          else
            echo "⚠ Note: /Applications shortcut check in DMG root"
          fi

          echo "==> 1. Running codesign verification..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✓ Codesign verification passed!"

          echo "==> 1b. Gatekeeper spctl assessment..."
          spctl --assess --type exec --verbose "$APP_PATH" 2>&1 || echo "Note: Gatekeeper evaluation (requires notarization ticket for accepted status)"

          echo "==> 2. Checking quarantine attributes on app..."
          APP_QATTR=$(xattr -l "$APP_PATH" 2>/dev/null || true)
          if echo "$APP_QATTR" | grep -q "quarantine"; then
            echo "⚠ WARNING: quarantine attribute present on .app inside DMG"
          else
            echo "✓ .app has no quarantine attribute"
          fi

          echo "==> 3. Inspecting architectures with lipo -info..."
          EXEC_NAME=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleExecutable 2>/dev/null || echo "Foreigners Studio")
          APP_BIN="$APP_PATH/Contents/MacOS/$EXEC_NAME"
          if [ ! -f "$APP_BIN" ]; then
            APP_BIN=$(find "$APP_PATH/Contents/MacOS" -type f -perm +111 | head -n 1)
          fi
          echo "Inspecting binary: $APP_BIN"
          lipo -info "$APP_BIN"

          LIPO_INFO=$(lipo -info "$APP_BIN")
          if echo "$LIPO_INFO" | grep -q "x86_64" && echo "$LIPO_INFO" | grep -q "arm64"; then
            echo "✓ Universal binary: contains both x86_64 and arm64"
          else
            echo "⚠ Note: Binary architecture: $LIPO_INFO"
          fi

          echo "==> 4. Test-launching application smoke test..."
          "$APP_BIN" &
          APP_PID=$!
          echo "Process spawned with PID $APP_PID. Waiting 5 seconds..."
          sleep 5

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✓ Test launch SUCCESS: PID $APP_PID running cleanly."
            kill -TERM "$APP_PID" 2>/dev/null || true
            sleep 1
            kill -9 "$APP_PID" 2>/dev/null || true
          else
            wait "$APP_PID"
            EXIT_CODE=$?
            echo "⚠ App exited with code: $EXIT_CODE (may be normal in headless CI)"
          fi

          echo "==> Unmounting verification volume..."
          hdiutil detach "$MOUNT_DIR" -force -quiet || true
          rm -rf "$MOUNT_DIR"
          echo "✓ macOS verification complete!"

      - name: Clean dist-release of .app bundles (keep only .dmg and .app.tar.gz)
        run: |
          # Remove any raw .app folders from dist-release — they expose internal bundle files
          find dist-release -maxdepth 1 -name "*.app" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "==> dist-release contents after cleanup:"
          ls -lh dist-release/

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: foreigners-studio-macos-universal
          path: |
            dist-release/*.dmg
            dist-release/*.app.tar.gz
            install-mac.sh

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && needs.build-windows.result == 'success'
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: foreigners-studio-windows-bundle
          path: win-artifacts

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: foreigners-studio-macos-universal
          path: mac-artifacts

      - name: Flatten artifacts for release
        run: |
          mkdir -p release-assets
          find win-artifacts -type f | while read f; do
            fname=$(basename "$f")
            cp "$f" "release-assets/$fname" 2>/dev/null || true
          done
          if [ -d "mac-artifacts" ]; then
            find mac-artifacts -type f | while read f; do
              fname=$(basename "$f")
              cp "$f" "release-assets/$fname" 2>/dev/null || true
            done
          fi
          echo "=== Release assets to publish ==="
          ls -lh release-assets/

      - name: Generate latest.json Manifest for Auto-Updater
        run: |
          TAG_NAME="v1.0.81"
          VERSION="1.0.81"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat << EOF > release-assets/latest.json
          {
            "version": "${VERSION}",
            "notes": "Foreigners Studio ${TAG_NAME} release update.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/pankaj886/foreigners-studio-releases/releases/download/${TAG_NAME}/Foreigners_Studio_${VERSION}_x64-setup.exe"
              },
              "darwin-universal": {
                "url": "https://github.com/pankaj886/foreigners-studio-releases/releases/download/${TAG_NAME}/Foreigners_Studio_${VERSION}_universal.dmg"
              }
            }
          }
          EOF
          echo "Generated release-assets/latest.json:"
          cat release-assets/latest.json

      - name: Publish Release Assets to Public Releases Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: pankaj886/foreigners-studio-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: v1.0.81
          name: Foreigners Studio v1.0.81
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
