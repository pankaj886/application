name: Build Foreigners Studio (Windows & macOS)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Windows Tauri Bundle
        run: npx tauri build --bundles nsis,msi

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: foreigners-studio-windows-bundle
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS App (.dmg & .app)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build macOS Tauri Bundle
        run: npx tauri build --bundles dmg,app

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: foreigners-studio-macos-universal
          path: src-tauri/target/release/bundle/dmg/*.dmg
