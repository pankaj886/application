name: Build Foreigners Studio (Windows & macOS)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Windows Tauri Bundle
        run: |
          npx tauri build --bundles nsis,msi
          node copy-release.js

      - name: Generate Self-Signed Code Signing Certificate
        shell: powershell
        run: |
          # Generate a proper code signing certificate
          $cert = New-SelfSignedCertificate `
            -Type CodeSigning `
            -Subject "CN=Foreigners Studio, O=Foreigners Studio, C=US" `
            -FriendlyName "Foreigners Studio Code Signing" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeySpec Signature `
            -KeyLength 4096 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10) `
            -KeyUsage DigitalSignature `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          $thumbprint = $cert.Thumbprint
          Write-Host "Generated certificate thumbprint: $thumbprint"

          # Export .cer (public key only) for distribution
          $cerPath = "certs\ForeignersStudio.cer"
          New-Item -ItemType Directory -Force -Path "certs" | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT | Out-Null
          Write-Host "Exported public cert to: $cerPath"

          # Export .pfx (with private key) for CI signing
          $pfxPassword = ConvertTo-SecureString -String "ForeignersStudio2024!" -Force -AsPlainText
          $pfxPath = "certs\ForeignersStudio.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPassword | Out-Null
          Write-Host "Exported PFX to: $pfxPath"

          # Import to TrustedPublisher & Root so SignTool recognizes it
          $tpStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPublisher","LocalMachine")
          $tpStore.Open("ReadWrite")
          $tpStore.Add($cert)
          $tpStore.Close()

          $rootStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root","LocalMachine")
          $rootStore.Open("ReadWrite")
          $rootStore.Add($cert)
          $rootStore.Close()

          Write-Host "Certificate added to TrustedPublisher and Root stores"
          echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV

      - name: Sign Windows Binaries with SignTool
        shell: powershell
        run: |
          # Find signtool.exe
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            $signtool = "signtool.exe"
          }
          Write-Host "Using signtool: $signtool"

          $thumbprint = $env:CERT_THUMBPRINT
          $timestampUrl = "http://timestamp.digicert.com"

          $targets = Get-ChildItem -Path "dist-release" -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
          foreach ($file in $targets) {
            Write-Host "Signing: $($file.FullName)"
            $result = & "$signtool" sign `
              /sha1 $thumbprint `
              /fd SHA256 `
              /tr "$timestampUrl" `
              /td SHA256 `
              /v `
              $file.FullName 2>&1
            Write-Host $result
            if ($LASTEXITCODE -ne 0) {
              # Fallback: Sign without timestamp
              & "$signtool" sign /sha1 $thumbprint /fd SHA256 /v $file.FullName 2>&1
            }
          }

      - name: Verify Authenticode Signatures
        shell: powershell
        run: |
          $targets = Get-ChildItem -Path dist-release -File | Where-Object { $_.Extension -in @(".exe", ".msi") }
          foreach ($file in $targets) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status) ($($sig.StatusMessage))"
          }

      - name: Package Windows Portable ZIP
        shell: powershell
        run: |
          $stagingDir = "$env:TEMP\fs_win_bundle_$(New-Guid)"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # Copy signed exe
          $exe = "dist-release\foreigners_studio.exe"
          if (Test-Path $exe) { Copy-Item $exe -Destination "$stagingDir\foreigners_studio.exe" }

          # Copy installers
          Get-ChildItem "dist-release" -Filter "*.exe" | Where-Object { $_.Name -ne "foreigners_studio.exe" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "$stagingDir\$($_.Name)"
          }

          # Copy support files
          if (Test-Path "Install-ForeignersStudio.bat") {
            Copy-Item "Install-ForeignersStudio.bat" -Destination "$stagingDir\Install-ForeignersStudio.bat"
          }
          if (Test-Path "install-windows.ps1") {
            Copy-Item "install-windows.ps1" -Destination "$stagingDir\install-windows.ps1"
          }

          # Copy certificate
          if (Test-Path "certs\ForeignersStudio.cer") {
            New-Item -ItemType Directory -Force -Path "$stagingDir\certs" | Out-Null
            Copy-Item "certs\ForeignersStudio.cer" -Destination "$stagingDir\certs\ForeignersStudio.cer"
            Copy-Item "certs\ForeignersStudio.cer" -Destination "$stagingDir\ForeignersStudio.cer"
          }

          $zipPath = "dist-release\Foreigners_Studio_Windows_x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stagingDir, $zipPath)
          Write-Host "Created ZIP: $zipPath"

          Remove-Item -Recurse -Force $stagingDir -ErrorAction SilentlyContinue

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: foreigners-studio-windows-bundle
          path: |
            dist-release/*.exe
            dist-release/*.msi
            dist-release/*.zip
            certs/*.cer
            Install-ForeignersStudio.bat
            install-windows.ps1

  build-macos:
    name: Build macOS App (.dmg & .app)
    runs-on: macos-latest
    env:
      COPYFILE_DISABLE: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build macOS Tauri Universal Bundle
        env:
          COPYFILE_DISABLE: "1"
        run: |
          npx tauri build --target universal-apple-darwin --bundles dmg,app
          node copy-release.js

      - name: Sanitize & Sign macOS Bundle
        env:
          COPYFILE_DISABLE: "1"
        run: bash clean-dmg.sh

      - name: Verify macOS Universal DMG & Application
        run: |
          echo "=========================================================="
          echo "  Verifying macOS Universal DMG & Code Signature          "
          echo "=========================================================="

          DMG_FILE=$(find dist-release -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ] || [ ! -f "$DMG_FILE" ]; then
            echo "❌ Error: No DMG found in dist-release!"
            ls -la dist-release || true
            exit 1
          fi
          echo "Found DMG installer: $DMG_FILE"

          # Verify DMG container is signed
          echo "==> Verifying DMG container codesign..."
          codesign --verify --verbose=2 "$DMG_FILE" 2>&1 || echo "Note: DMG container signature check"

          # Check DMG quarantine attributes (should be empty)
          echo "==> Checking DMG quarantine attributes..."
          QATTR=$(xattr -l "$DMG_FILE" 2>/dev/null || true)
          if echo "$QATTR" | grep -q "quarantine"; then
            echo "⚠ WARNING: quarantine attribute still present on DMG"
            xattr -d com.apple.quarantine "$DMG_FILE" 2>/dev/null || true
          else
            echo "✓ DMG has no quarantine attribute"
          fi

          echo "==> Mounting DMG for verification..."
          MOUNT_DIR="/tmp/verify_mount_$$"
          mkdir -p "$MOUNT_DIR"
          hdiutil attach "$DMG_FILE" -mountpoint "$MOUNT_DIR" -nobrowse -noautoopen -quiet

          echo "==> Locating .app bundle inside mounted DMG..."
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Error: No .app bundle found inside mounted DMG!"
            ls -la "$MOUNT_DIR"
            hdiutil detach "$MOUNT_DIR" -force -quiet || true
            exit 1
          fi
          echo "Found App bundle: $APP_PATH"

          echo "==> 1. Running codesign verification..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✓ Codesign verification passed!"

          echo "==> 2. Checking quarantine attributes on app..."
          APP_QATTR=$(xattr -l "$APP_PATH" 2>/dev/null || true)
          if echo "$APP_QATTR" | grep -q "quarantine"; then
            echo "⚠ WARNING: quarantine attribute present on .app inside DMG"
          else
            echo "✓ .app has no quarantine attribute"
          fi

          echo "==> 3. Inspecting architectures with lipo -info..."
          EXEC_NAME=$(defaults read "$APP_PATH/Contents/Info.plist" CFBundleExecutable 2>/dev/null || echo "Foreigners Studio")
          APP_BIN="$APP_PATH/Contents/MacOS/$EXEC_NAME"
          if [ ! -f "$APP_BIN" ]; then
            APP_BIN=$(find "$APP_PATH/Contents/MacOS" -type f -perm +111 | head -n 1)
          fi
          echo "Inspecting binary: $APP_BIN"
          lipo -info "$APP_BIN"

          LIPO_INFO=$(lipo -info "$APP_BIN")
          if echo "$LIPO_INFO" | grep -q "x86_64" && echo "$LIPO_INFO" | grep -q "arm64"; then
            echo "✓ Universal binary: contains both x86_64 and arm64"
          else
            echo "⚠ Note: Binary architecture: $LIPO_INFO"
          fi

          echo "==> 4. Test-launching application smoke test..."
          "$APP_BIN" &
          APP_PID=$!
          echo "Process spawned with PID $APP_PID. Waiting 5 seconds..."
          sleep 5

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✓ Test launch SUCCESS: PID $APP_PID running cleanly."
            kill -TERM "$APP_PID" 2>/dev/null || true
            sleep 1
            kill -9 "$APP_PID" 2>/dev/null || true
          else
            wait "$APP_PID"
            EXIT_CODE=$?
            echo "⚠ App exited with code: $EXIT_CODE (may be normal in headless CI)"
          fi

          echo "==> Unmounting verification volume..."
          hdiutil detach "$MOUNT_DIR" -force -quiet || true
          rm -rf "$MOUNT_DIR"
          echo "✓ macOS verification complete!"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: foreigners-studio-macos-universal
          path: |
            dist-release/*.dmg
            dist-release/*.app.tar.gz
            install-mac.sh

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: foreigners-studio-windows-bundle
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: foreigners-studio-macos-universal
          path: dist-release

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.exe
            dist-release/*.msi
            dist-release/*.zip
            dist-release/*.dmg
            dist-release/*.app.tar.gz
            dist-release/*.cer
            dist-release/*.bat
            dist-release/*.ps1
            dist-release/install-mac.sh
          draft: false
          prerelease: false
          generate_release_notes: true
